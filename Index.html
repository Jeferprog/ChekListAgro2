  <!-- Componentes em React usando Babel compiler -->
  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // --- ÍCONES INLINE SVG PARA MÁXIMA COMPATIBILIDADE E ROBUSTEZ ---

    const IconInfo = () => (

    );
    const IconMapPin = () => (
      <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path strokeLinecap="round" strokeLinejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
    );
    const IconSettings = () => (
      <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path strokeLinecap="round" strokeLinejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
    );

    // --- GOOGLE APPS SCRIPT WRAPPER DE SEGURANÇA ---
    const runGas = (methodName, ...args) => {
      return new Promise((resolve, reject) => {
        if (typeof window !== "undefined" && window.google && window.google.script) {
          window.google.script.run
            .withSuccessHandler(result => resolve(result))
            .withFailureHandler(error => reject(error))[methodName](...args);
        } else {
          // Fallback para desenvolvimento local
          console.warn(`Executando mock para o método ${methodName}`);
          setTimeout(() => {
            if (methodName === "obterLinkConsulta") resolve("https://www.bcb.gov.br/sicor/");
            else if (methodName === "obterInfoUsuario") resolve({ email: "dev@local", admin: true });
            else if (methodName === "obterLinkBase") resolve("https://drive.google.com/drive/folders/exemplo");
            else if (methodName === "obterEmailsAdmin") resolve(["jeferson.deimling@cresolsicoper.com.br"]);
            else if (methodName === "obterLimitesEnquadramento") resolve({ pronaf: 250000, pronamp: 1500000 });
            else if (methodName === "listarTodasAsLinhas") resolve([
              { id: "L-001", nome: "PRONAF CUSTEIO AGRÍCOLA - Faixa I", orgao: "Cresol / BNDES", finalidadePrincipal: "Custeio", finalidades: "agricola,custeio", enquadramento: "Sem limite/R$ 500 mil", taxaMin: 3, taxaMax: 4.5, taxaDescricao: "3% a 4.5% a.a.", prazo: 24, carencia: 3, limiteMin: 5000, limiteMax: 250000, requisitos: "DAP ativa", documentos: "(P) RG\n(P) DAP/CAF Ativa", status: "Ativa", observacoes: "", itensFinanciaveis: "Sementes, defensivos", culturas: "MILHO (até 25 mil), SOJA, TRIGO", tipoPessoa: "PF", temChecklist: true }
            ]);
            else if (methodName === "buscarAssociado") resolve({
              sucesso: true, nome: "JEFERSON OLIVEIRA DA SILVA", cpfCnpj: "12345678909", conta: "12345-6", tipo: "Física", rendaAnual: 350000, rendaMensal: 29166
            });
            else if (methodName === "buscarCreditoTomado") resolve({
              sucesso: true, items: [{ anoSafra: "2025/2026", produto: "PRONAF CUSTEIO AGRÍCOLA", atividade: "Milho", ifFin: "Cresol", valorFinanciado: 45000, aliquotaProagro: 3, valorTomado: 46350 }], totalFinanciado: 46350
            });
            else if (methodName === "obterChecklistDocs") resolve(["(P) Extrato DAP", "(P) CAR Recibo", "(F) CETCR", "(F) CCB"]);
            else if (methodName === "importarChecklistLinha") resolve({ sucesso: true, success: true, nome: "PRONAF CUSTEIO AGRÍCOLA Faixa I", qtdP: 10, qtdF: 7, total: 17 });
            else if (methodName === "iaConfigurada") resolve({ success: true, sucesso: true, configurada: true });
            else if (methodName === "obterConfigIA") resolve({ success: true, sucesso: true, configurada: true, provider: "gemini", modelo: "gemini-2.5-flash", diretrizes: "Você é o Especialista em Crédito Rural e Agronegócio da Cresol. (diretrizes padrão — modo local)", diretrizesPadrao: "Você é o Especialista em Crédito Rural e Agronegócio da Cresol. (diretrizes padrão — modo local)" });
            else if (methodName === "salvarConfigIA") resolve({ success: true, sucesso: true, provider: "gemini", modelo: "gemini-2.5-flash", mensagem: "Configurações da IA salvas." });
            else if (methodName === "salvarChaveIA") resolve({ success: true, sucesso: true, configurada: true, mensagem: "Chave salva com segurança." });
            else if (methodName === "sugerirMelhorLinhaIA") resolve({ success: true, sucesso: true, recomendacao: "1) Classificação do produtor: PRONAF.\n2) Tipo de operação: Custeio agrícola.\n3) Linha recomendada: PRONAF CUSTEIO AGRÍCOLA - Faixa I (3% a.a.), por ser a de menor taxa para milho até 25 mil, dentro do teto de R$ 250 mil.\n4) Alternativas: Faixa II (6.5% a.a.) caso a cultura não se enquadre na Faixa I.\n5) Ressalvas: confirmar DAP/CAF ativa e limite disponível no SICOR. (resposta simulada - modo local)" });
            else resolve({ success: true });
          }, 600);
        }
      });
    };

    // --- COMPONENTE PRINCIPAL ---
    function App() {
      const [currentTab, setCurrentTab] = useState("consulta");
      const [isAdmin, setIsAdmin] = useState(false);
      const [userEmail, setUserEmail] = useState("");
      const [loading, setLoading] = useState(false);
      const [loadingText, setLoadingText] = useState("Carregando...");
      const [configs, setConfigs] = useState([]);
      const [limites, setLimites] = useState({ pronaf: 250000, pronamp: 1500000 });
      const [linhas, setLinhas] = useState([]);
      const [searchResult, setSearchResult] = useState([]);
      const [searchPerformed, setSearchPerformed] = useState(false);
      
      // Form de Consulta / Simulador
      const [buscaCpf, setBuscaCpf] = useState("");
      const [associadoData, setAssociadoData] = useState(null);
      const [creditHistory, setCreditHistory] = useState([]);
      const [paramFinalidade, setParamFinalidade] = useState("");
      const [paramProduto, setParamProduto] = useState("");
      const [customTipoPessoa, setCustomTipoPessoa] = useState("");
      const [customRenda, setCustomRenda] = useState("");
      const [customValorTomado, setCustomValorTomado] = useState("");
      const [customEnquadramento, setCustomEnquadramento] = useState("demais");
      const [autoEnquadramento, setAutoEnquadramento] = useState(true);

      // Agente de IA
      const [iaDisponivel, setIaDisponivel] = useState(false);
      const [iaLoading, setIaLoading] = useState(false);
      const [iaRecomendacao, setIaRecomendacao] = useState("");
      const [iaErro, setIaErro] = useState("");
      const [chaveIA, setChaveIA] = useState("");
      const [salvandoChaveIA, setSalvandoChaveIA] = useState(false);
      const [iaProvider, setIaProvider] = useState("gemini");
      const [iaModelo, setIaModelo] = useState("");
      const [iaDiretrizes, setIaDiretrizes] = useState("");
      const [salvandoConfigIA, setSalvandoConfigIA] = useState(false);

      // Controle de Modais
      const [showAddModal, setShowAddModal] = useState(false);
      const [showEditModal, setShowEditModal] = useState(false);
      const [selectedLine, setSelectedLine] = useState(null);
      const [showChecklistModal, setShowChecklistModal] = useState(false);
      const [checklistLineName, setChecklistLineName] = useState("");
      const [checklistLine, setChecklistLine] = useState(null);
      const [checklistItems, setChecklistItems] = useState([]);
      const [showDocxParser, setShowDocxParser] = useState(false);
      const [docxItems, setDocxItems] = useState([]);

      // Formulário para Cadastrar/Editar Linha
      const [lineForm, setLineForm] = useState({
        nome: "", orgao: "Cresol", finalidadePrincipal: "Custeio", finalidades: "",
        enquadramento: "", taxaMin: "", taxaMax: "", taxaDescricao: "",
        prazo: "", carencia: "", limiteMin: "", limiteMax: "",
        requisitos: "", documentos: "", status: "Ativa", observacoes: "",
        itensFinanciaveis: "", culturas: ""
      });

      // Carregar dados iniciais
      useEffect(() => {
        carregarInfoUsuario();
        carregarConfiguracoes();
        carregarLinhas();
        carregarStatusIA();
      }, []);

      // Carrega o status e a configuração da IA (provedor, modelo, diretrizes).
      // A chave da API nunca é retornada pelo backend.
      const carregarStatusIA = async () => {
        try {
          const r = await runGas("obterConfigIA");
          setIaDisponivel(!!(r && r.configurada));
          if (r && r.provider) setIaProvider(r.provider);
          if (r && r.modelo !== undefined) setIaModelo(r.modelo || "");
          if (r && r.diretrizes !== undefined) setIaDiretrizes(r.diretrizes || "");
        } catch (e) {
          setIaDisponivel(false);
        }
      };

      // Perfil do usuário: define se as abas administrativas aparecem
      const carregarInfoUsuario = async () => {
        try {
          const info = await runGas("obterInfoUsuario");
          const admin = !!(info && info.admin);
          setIsAdmin(admin);
          setUserEmail((info && info.email) || "");
          // Se não é admin e está numa aba administrativa, volta para a consulta
          if (!admin) setCurrentTab("consulta");
        } catch (e) {
          console.error(e);
          setIsAdmin(false);
        }
      };

      const carregarConfiguracoes = async () => {
        try {
          const l = await runGas("obterLimitesEnquadramento");
          setLimites(l);
          const linkCons = await runGas("obterLinkConsulta");
          const linkB = await runGas("obterLinkBase");
          const emails = await runGas("obterEmailsAdmin");
          setConfigs([
            { param: "Link Consulta Crédito (SICOR/CACR)", valor: linkCons },
            { param: "Link Pasta Base de Associados", valor: linkB },
            { param: "E-mails Administradores", valor: emails.join(", ") }
          ]);
        } catch (e) {
          console.error(e);
        }
      };

      const carregarLinhas = async () => {
        setLoading(true);
        setLoadingText("Carregando linhas de crédito...");
        try {
          const res = await runGas("listarTodasAsLinhas");
          setLinhas(res);
        } catch (e) {
          console.error(e);
        } finally {
          setLoading(false);
        }
      };

      // Auto-enquadramento baseado na renda do associado
      useEffect(() => {
        if (autoEnquadramento && associadoData) {
          const renda = associadoData.rendaAnual;
          if (renda <= limites.pronaf) {
            setCustomEnquadramento("pronaf");
          } else if (renda <= limites.pronamp) {
            setCustomEnquadramento("pronamp");
          } else {
            setCustomEnquadramento("demais");
          }
        }
      }, [associadoData, limites, autoEnquadramento]);

      // Busca de associado no bando de dados
      const handleBuscarAssociado = async () => {
        if (!buscaCpf) return;
        setLoading(true);
        setLoadingText("Buscando dados do associado...");
        try {
          const assoc = await runGas("buscarAssociado", buscaCpf);
          if (assoc.sucesso) {
            setAssociadoData(assoc);
            setCustomRenda(assoc.rendaAnual);
            // Detecta PF/PJ pelo tipo (ds_pessoa_tipo) ou pelo tamanho do documento
            const tp = String(assoc.tipo || "").toLowerCase();
            const soDigitos = String(assoc.cpfCnpj || "").replace(/\D/g, "");
            if (tp.indexOf("jur") !== -1 || tp === "pj" || soDigitos.length === 14) setCustomTipoPessoa("PJ");
            else if (tp.indexOf("fis") !== -1 || tp === "pf" || soDigitos.length === 11) setCustomTipoPessoa("PF");
            // Buscar crédito já tomado
            const cred = await runGas("buscarCreditoTomado", assoc.cpfCnpj);
            if (cred.sucesso) {
              setCreditHistory(cred.items);
              setCustomValorTomado(cred.totalFinanciado);
            } else {
              setCreditHistory([]);
              setCustomValorTomado(0);
            }
          } else {
            alert("Associado não cadastrado na base oficial da Cresol.");
            setAssociadoData(null);
            setCreditHistory([]);
            setCustomValorTomado("");
          }
        } catch (err) {
          console.error(err);
          alert("Erro ao consultar associado.");
        } finally {
          setLoading(false);
        }
      };

      // MECANISMO DE CORRESPONDÊNCIA / BUSCAR LINHAS (FRONTEND MATCHING)
      const handleBuscarLinhas = () => {
        setLoading(true);
        setLoadingText("Processando enquadramento...");
        setIaRecomendacao("");
        setIaErro("");

        setTimeout(() => {
          const renda = parseFloat(customRenda) || 0;
          const valorTomado = parseFloat(customValorTomado) || 0;
          const activeLines = linhas.filter(l => l.status === "Ativa");

          const helperGroupLinha = (nome, enqTexto) => {
            const n = String(nome || "").toUpperCase();
            if (n.includes("PRONAF")) return "pronaf";
            if (n.includes("PRONAMP")) return "pronamp";
            const e = String(enqTexto || "").toLowerCase();
            if (e.includes("sem limite")) return "pronaf";
            if (e.includes("500 mil") && (e.includes("3.5") || e.includes("3,5"))) return "pronamp";
            return "demais";
          };

          // Interpreta "mil" (x1.000) e "mi"/"milhão" (x1.000.000) usando
          // fronteira de palavra — evita que "mil" seja lido como "mi".
          const helperParseRenda = (texto) => {
            if (!texto) return null;
            const t = String(texto).toLowerCase().trim();
            const m = t.match(/([\d.,]+)/);
            if (!m) return null;
            let num = parseFloat(m[1].replace(/\s/g, "").replace(",", "."));
            if (isNaN(num)) return null;
            if (/milh|\bmi\b/.test(t)) num *= 1000000;
            else if (/\bmil\b/.test(t)) num *= 1000;
            return num;
          };

          // Parser para o teto por cultura ("(até 25 mil)"): remove pontos de
          // milhar antes de converter (equivalente ao _parseValorTexto do backend).
          const helperParseValorTexto = (s) => {
            const t = String(s || "").toLowerCase();
            const m = t.match(/([\d.,]+)/);
            if (!m) return null;
            let n = parseFloat(m[1].replace(/\./g, "").replace(",", "."));
            if (isNaN(n)) return null;
            if (/milh|\bmi\b/.test(t)) n *= 1000000;
            else if (/\bmil\b/.test(t)) n *= 1000;
            return n;
          };

          const helperValidarRenda = (rendaVal, enqTexto) => {
            if (!enqTexto || enqTexto === "" || enqTexto.includes("conforme")) return true;
            if (enqTexto.includes("/")) {
              const parts = enqTexto.split("/");
              const minText = parts[0].trim();
              const maxText = parts[1].trim();
              const min = minText.toLowerCase().includes("sem limite") ? 0 : (helperParseRenda(minText) || 0);
              const max = maxText.toLowerCase().includes("sem limite") ? Infinity : (helperParseRenda(maxText) || Infinity);
              return rendaVal >= min && rendaVal <= max;
            }
            if (enqTexto.toLowerCase().includes("acima")) {
              const min = helperParseRenda(enqTexto);
              return min === null ? true : rendaVal > min;
            }
            if (enqTexto.toLowerCase().includes("até") || enqTexto.toLowerCase().includes("ate")) {
              const max = helperParseRenda(enqTexto);
              return max === null ? true : rendaVal <= max;
            }
            return true;
          };

          const helperValidarTags = (searched, tagsText) => {
            if (!searched || !tagsText) return true;
            const tags = tagsText.toLowerCase().split(",").map(t => t.trim()).filter(Boolean);
            const searchTerms = searched.toLowerCase().split(",").map(t => t.trim()).filter(Boolean);
            if (tags.length === 0 || searchTerms.length === 0) return true;
            return searchTerms.some(term => tags.some(tag => tag.includes(term) || term.includes(tag)));
          };

          const helperKeywordMatch = (searched, line) => {
            if (!searched) return true;
            const term = searched.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
            if (!term) return true;
            const textToSearch = [
              line.nome, line.finalidadePrincipal, line.finalidades,
              line.itensFinanciaveis, line.culturas, line.documentos, line.observacoes
            ].join(" ").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
            // S\u00f3 considera palavras com 3+ letras; basta uma casar (igual ao backend)
            const words = term.split(/\s+/).filter(w => w.length >= 3);
            if (words.length === 0) return true;
            return words.some(word => textToSearch.includes(word));
          };

          const helperCapCultura = (productText, culturesText) => {
            if (!productText || !culturesText) return null;
            const term = productText.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
            if (term.length < 3) return null;
            const cultures = culturesText.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
            // Escapa caracteres especiais do termo antes de montar o RegExp
            const termEsc = term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            const matchMax = cultures.match(new RegExp(termEsc + "[^,;()]*\\(\\s*ate\\s*([^)]+)\\)"));
            if (matchMax) {
              const v = helperParseValorTexto(matchMax[1]);
              if (v) return { tipo: "max", valor: v };
            }
            const matchMin = cultures.match(new RegExp(termEsc + "[^,;()]*\\(\\s*acima\\s*de\\s*([^)]+)\\)"));
            if (matchMin) {
              const v = helperParseValorTexto(matchMin[1]);
              if (v) return { tipo: "min", valor: v };
            }
            return null;
          };

          const matched = activeLines
            .filter(l => {
              // Validar grupo
              const lineGroup = helperGroupLinha(l.nome, l.enquadramento);
              if (lineGroup !== customEnquadramento) return false;

              // Tipo de pessoa: linha só-PF não aparece para PJ (e vice-versa).
              // Linhas com "PF/PJ" ou sem classificação passam sempre.
              const lineTP = String(l.tipoPessoa || "").toUpperCase();
              if (customTipoPessoa === "PJ" && lineTP === "PF") return false;
              if (customTipoPessoa === "PF" && lineTP === "PJ") return false;

              // Validar renda
              if (!helperValidarRenda(renda, l.enquadramento)) return false;

              // Validar tags
              if (!helperValidarTags(paramFinalidade, l.finalidades)) return false;

              // Validar palavra chave
              if (!helperKeywordMatch(paramProduto || "", l)) return false;

              return true;
            })
            .map(l => {
              let maxLimit = l.limiteMax;
              let minLimit = l.limiteMin;
              let capCulturaValor = 0;
              let capCulturaTipo = "";

              const cap = helperCapCultura(paramProduto || "", l.culturas);
              if (cap) {
                if (cap.tipo === "max") {
                  if (maxLimit === 0 || cap.valor < maxLimit) maxLimit = cap.valor;
                  capCulturaValor = cap.valor;
                  capCulturaTipo = "max";
                } else if (cap.tipo === "min") {
                  if (cap.valor > minLimit) minLimit = cap.valor;
                  capCulturaValor = cap.valor;
                  capCulturaTipo = "min";
                }
              }

              const available = Math.max(0, maxLimit - valorTomado);

              return {
                ...l,
                limiteMax: maxLimit,
                limiteMin: minLimit,
                limiteDisponivel: available,
                valorTomado: valorTomado,
                capCulturaValor,
                capCulturaTipo
              };
            })
            .filter(l => {
              if (valorTomado > 0 && l.limiteMax > 0 && l.limiteDisponivel <= 0) {
                return false;
              }
              return true;
            });

          setSearchResult(matched);

      // Consulta o agente de IA para sugerir a melhor linha (menor custo/prazo).

      const handleXlsxCreditUpload = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;

        setLoading(true);
        setLoadingText("Processando arquivo de crédito tomado...");
        const reader = new FileReader();
        reader.onload = async (event) => {
          try {
            // event.target.result = "data:...;base64,XXXX" -> envia só o base64
            const dataUrl = String(event.target.result || "");
            const base64 = dataUrl.split(",")[1] || "";
            const resp = await runGas("processarArquivoCredito", file.name, base64);
            if (resp && (resp.success || resp.sucesso)) {
              alert(`✓ Base de crédito tomado atualizada! ${resp.registros} registro(s) importado(s).`);
            } else {
              alert("✕ Erro ao processar arquivo: " + ((resp && (resp.error || resp.erro)) || "Formato inválido."));
            }
          } catch (err) {
            console.error(err);
            alert("✕ Erro: " + (err && err.message ? err.message : err));
          } finally {
            setLoading(false);
            e.target.value = "";
          }
        };
        reader.onerror = () => {
          setLoading(false);
          alert("✕ Não foi possível ler o arquivo selecionado.");
          e.target.value = "";
        };
        reader.readAsDataURL(file);
      };

      // IMPORTAR LINHAS VIA .docx REAL DA CRESOL (envia o arquivo como base64)
      const handleDocxUpload = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        if (!file.name.toLowerCase().endsWith(".docx")) {
          alert("✕ O arquivo deve ser .docx (circular da Cresol).");
          e.target.value = "";
          return;
        }
        setLoading(true);
        setLoadingText("Lendo e processando o arquivo .docx da Cresol...");
        const reader = new FileReader();
        reader.onload = async (event) => {
          try {
            // event.target.result = "data:...;base64,XXXX" -> envia só o base64
            const dataUrl = String(event.target.result || "");
            const base64 = dataUrl.split(",")[1] || "";
            const res = await runGas("processarArquivoCresol", base64, file.name);
            if (res && (res.sucesso || res.success) && Array.isArray(res.itens) && res.itens.length) {
              setDocxItems(res.itens.map(i => ({ ...i, selecionado: !!i.rural })));
              setShowDocxParser(true);
            } else {
              alert("✕ " + ((res && (res.erro || res.error)) || "Nenhuma linha encontrada no arquivo."));
            }
          } catch (err) {
            console.error(err);
            alert("✕ Erro ao processar o .docx: " + (err && err.message ? err.message : err));
          } finally {
            setLoading(false);
            e.target.value = "";
          }
        };
        reader.onerror = () => {
          setLoading(false);
          alert("✕ Não foi possível ler o arquivo selecionado.");
          e.target.value = "";
        };
        reader.readAsDataURL(file);
      };

      const handleConfirmDocx = async () => {
        const indexes = docxItems.filter(i => i.selecionado).map(i => i.idx);
        if (indexes.length === 0) {
          alert("Selecione ao menos uma linha para incluir.");
          return;
        }
        setLoading(true);
        setLoadingText("Aplicando atualização e gerando backup...");
        try {
          const res = await runGas("aplicarAtualizacaoCresol", indexes);
          if (res && (res.sucesso || res.success)) {
            alert(`✓ Sucesso! ${res.linhas} linha(s) integrada(s) na base.` + (res.backup ? `\nBackup criado: ${res.backup}` : ""));
            setShowDocxParser(false);
            await carregarLinhas();
          } else {
            alert("✕ " + ((res && (res.erro || res.error)) || "Falha ao aplicar a atualização."));

          alert("✕ Erro ao aplicar: " + (e && e.message ? e.message : e));
        } finally {
          setLoading(false);

                          <span className="text-text-gray block text-[10px] uppercase font-bold">Renda Mensal</span>
                          <span className="font-medium">R$ {Number(associadoData.rendaMensal || 0).toLocaleString("pt-BR", { minimumFractionDigits: 2 })}</span>
                        </div>
                      </div>
                    </div>
                  )}

                  {/* RESUMO DA LINHA SELECIONADA */}
                  {checklistLine && (
                    <div className="border border-border-gray/50 rounded-lg p-3.5">
                      <div className="flex items-center gap-2 mb-2">
                        {checklistLine.orgao && (
                          <span className="bg-[#0d6efd] text-white text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider">{checklistLine.orgao}</span>
                        )}
                        <span className="text-[10px] font-bold uppercase tracking-wider text-primary-green">Resumo da Linha</span>
                      </div>
                      <div className="grid grid-cols-2 md:grid-cols-4 gap-3 text-xs">
                        <div>
                          <span className="text-text-gray block text-[10px] uppercase font-bold">Taxas Aplicadas</span>
                          <span className="font-bold text-text-dark">{checklistLine.taxaDescricao || `${checklistLine.taxaMin || 0}% a.a.`}</span>
                        </div>
                        <div>
                          <span className="text-text-gray block text-[10px] uppercase font-bold">Prazo / Carência</span>
                          <span className="font-medium text-text-dark">{checklistLine.prazo || 0} m ({checklistLine.carencia || 0}m carência)</span>
                        </div>
                        <div>
                          <span className="text-text-gray block text-[10px] uppercase font-bold">Teto Máximo</span>
                          <span className="font-bold text-text-dark">R$ {Number(checklistLine.limiteMax || 0).toLocaleString("pt-BR", { minimumFractionDigits: 2 })}</span>
                        </div>
                        <div>
                          <span className="text-text-gray block text-[10px] uppercase font-bold">Saldo Disponível</span>
                          <span className="font-bold text-success-green">R$ {Number(checklistLine.limiteDisponivel || 0).toLocaleString("pt-BR", { minimumFractionDigits: 2 })}</span>
                        </div>
                      </div>
                      {checklistLine.capCulturaValor > 0 && (
                        <div className="mt-2.5 p-2 bg-amber-50 border border-amber-200 text-[11px] text-amber-800 rounded">
                          <strong>Nota:</strong> Limite máximo recalculado para <strong>R$ {Number(checklistLine.capCulturaValor).toLocaleString("pt-BR")}</strong> conforme a cultura informada.
                        </div>
                      )}
                      <div className="mt-2.5 text-xs flex flex-col gap-1 text-text-gray bg-slate-50 p-2.5 rounded border border-border-gray/40 font-light">
                        <div><strong>Itens Financiáveis:</strong> {checklistLine.itensFinanciaveis || "Gerais para a modalidade"}</div>
                        <div><strong>Requisitos:</strong> {checklistLine.requisitos || "Documentação regular básica"}</div>
                      </div>
                    </div>
                  )}

                  {/* HISTÓRICO SICOR (LINHAS JÁ CONTRATADAS) */}
                  {associadoData && creditHistory.length > 0 && (
                    <div className="border border-border-gray/50 rounded-lg p-3.5">
                      <div className="text-[10px] font-bold uppercase tracking-wider text-primary-green mb-2">Linhas Ativas Já Contratadas (Histórico SICOR)</div>
                      <div className="overflow-x-auto">
                        <table className="w-full text-left text-xs border-collapse">
                          <thead>
                            <tr className="border-b border-border-gray text-text-gray font-bold">
                              <th className="py-1.5">Safra</th>
                              <th className="py-1.5">Produto</th>
                              <th className="py-1.5">Atividade</th>
                              <th className="py-1.5">IF</th>
                              <th className="py-1.5 text-right">Financiado (R$)</th>
                              <th className="py-1.5 text-right">ProAgro</th>
                              <th className="py-1.5 text-right">Tomado (R$)</th>
                            </tr>
                          </thead>
                          <tbody>
                            {creditHistory.map((h, i) => (
                              <tr key={i} className="border-b border-border-gray/30">
                                <td className="py-1.5 font-medium">{h.anoSafra}</td>
                                <td className="py-1.5">{h.produto}</td>
                                <td className="py-1.5">{h.atividade}</td>
                                <td className="py-1.5">{h.ifFin}</td>
                                <td className="py-1.5 text-right">
                                  R$ {Number(h.valorFinanciado || 0).toLocaleString("pt-BR", { minimumFractionDigits: 2 })}
                                </td>
                                <td className="py-1.5 text-right">{Number(h.aliquotaProagro || 0).toLocaleString("pt-BR")}%</td>
                                <td className="py-1.5 text-right font-bold text-[#dc3545]">
                                  R$ {Number(h.valorTomado || 0).toLocaleString("pt-BR", { minimumFractionDigits: 2 })}
                                </td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  )}

                  {/* DOCUMENTOS DO CHECKLIST */}
                  <div className="text-[10px] font-bold uppercase tracking-wider text-primary-green">Documentos do Checklist</div>

                  {[
                    { etapa: "P", titulo: "Pré-Contratação", desc: "Documentos exigidos na pré-contratação", cor: "text-primary-green", chip: "bg-emerald-100 text-emerald-800" },
                    { etapa: "F", titulo: "Formalização", desc: "Documentos exigidos na formalização", cor: "text-[#0d6efd]", chip: "bg-blue-100 text-blue-800" },
                    { etapa: "", titulo: "Outros documentos", desc: "", cor: "text-text-gray", chip: "bg-slate-100 text-slate-700" }
                  ].map(grp => {
                    const doGrupo = checklistItems.filter(it => it.etapa === grp.etapa);
                    if (doGrupo.length === 0) return null;
                    return (
                      <div key={grp.etapa || "outros"} className="flex flex-col gap-1.5">
                        <div className="flex items-center gap-2">
                          <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider ${grp.chip}`}>
                            {grp.etapa ? `(${grp.etapa}) ${grp.titulo}` : grp.titulo}
                          </span>
                          {grp.desc && <span className="text-[10px] text-text-gray font-light">{grp.desc}</span>}
                        </div>
                        {checklistItems.map((item, i) => (
                          item.etapa !== grp.etapa ? null : (
                            <label key={i} className="flex items-start gap-2.5 py-1.5 px-2 bg-slate-50 border border-border-gray/30 rounded cursor-pointer hover:bg-slate-100/70 transition-colors">
                              <input
                                type="checkbox"
                                checked={item.checked}
                                onChange={() => toggleChecklistItem(i)}
                                className="rounded accent-primary-green mt-1 cursor-pointer"
                              />
                              <span className={`text-xs ${item.checked ? "line-through text-text-gray" : "text-text-dark font-medium"}`}>
                                {item.text}
                              </span>
                            </label>
                          )
                        ))}
                      </div>
                    );
                  })}
                  {checklistItems.length === 0 && (
                    <p className="text-xs text-text-gray text-center py-6">Nenhum documento cadastrado para esta linha.</p>
                  )}
                </div>

                <div className="flex justify-between items-center pt-2 border-t border-border-gray/40">
                  <span className="text-[10px] text-text-gray font-bold uppercase">
                    Pendente: {checklistItems.filter(i => !i.checked).length} item(ns)
                  </span>
                  <div className="flex gap-2">
                    <button
                      onClick={handlePrintChecklist}
                      className="bg-primary-green text-white text-xs font-bold px-3 py-1.5 rounded hover:bg-opacity-95 flex items-center gap-1.5"
                    >
                      🖨️ Imprimir Documento
                    </button>
                    <button
                      onClick={() => setShowChecklistModal(false)}
                      className="border border-border-gray text-xs font-bold text-text-gray px-3 py-1.5 rounded"
                    >
                      Fechar
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* --- MODAL 2: IMPORTAÇÃO E STAGING DOCX --- */}
          {showDocxParser && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4">
              <div className="bg-white rounded-lg border-l-4 border-accent-orange max-w-xl w-full p-6 shadow-xl relative">
                <div className="border-b border-border-gray pb-3 mb-4">
                  <h3 className="font-bold text-primary-green text-base">Processador Normativo Cresol (Importação)</h3>
                  <p className="text-xs text-text-gray font-light mt-0.5">Linhas identificadas no arquivo .docx enviado. Marque as que deseja incluir — a base atual será substituída (com backup automático).</p>
                </div>

                <div className="flex flex-col gap-2 max-h-60 overflow-y-auto mb-4">
                  {docxItems.map((item, idx) => (
                    <div
                      key={idx}
                      onClick={() => toggleDocxItem(idx)}
                      className={`p-3 border rounded cursor-pointer transition-all flex justify-between items-center ${
                        item.selecionado
                          ? "border-primary-green bg-emerald-50 text-primary-green"
                          : "border-border-gray bg-white text-text-gray"
                      }`}
                    >
                      <div>
                        <span className="text-[10px] font-bold uppercase">Encontrado</span>
                        <h4 className="text-xs font-bold">{item.nome}</h4>
                      </div>
                      <input
                        type="checkbox"
                        checked={item.selecionado}
                        onChange={() => {}} // Handle by click div
                        className="rounded accent-primary-green"
                      />
                    </div>
                  ))}
                </div>

                <div className="flex justify-end gap-2 pt-2 border-t border-border-gray/50">
                  <button
                    onClick={handleCancelDocx}
                    className="border border-border-gray text-xs font-bold px-4 py-2 rounded"
                  >
                    Cancelar
                  </button>
                  <button
                    onClick={handleConfirmDocx}
                    className="bg-accent-orange text-white text-xs font-bold px-4 py-2 rounded"
                  >
                    Confirmar e Integrar Selecionados
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* --- MODALS DE CADASTRO / EDIÇÃO MANUAL --- */}
          {(showAddModal || showEditModal) && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4 overflow-y-auto">
              <form
                onSubmit={showAddModal ? handleCreateLine : handleUpdateLine}
                className="bg-white rounded-lg border-l-4 border-accent-orange max-w-2xl w-full p-6 shadow-xl my-8 relative"
              >
                <div className="border-b border-border-gray pb-3 mb-4">
                  <h3 className="font-bold text-primary-green text-base">
                    {showAddModal ? "Cadastrar Nova Linha de Crédito" : "Editar Linha de Crédito"}
                  </h3>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs mb-5">
                  <div className="md:col-span-2">
                    <label className="font-bold block mb-1">Nome Oficial da Linha</label>
                    <input
                      type="text"
                      required
                      value={lineForm.nome}
                      onChange={e => setLineForm({...lineForm, nome: e.target.value})}
                      className="w-full border border-border-gray rounded px-2.5 py-1.5 focus:outline-none"
                    />
                  </div>

                  <div>
                    <label className="font-bold block mb-1">Órgão / Instituição Repassadora</label>
                    <input
                      type="text"
                      value={lineForm.orgao}
                      onChange={e => setLineForm({...lineForm, orgao: e.target.value})}
                      className="w-full border border-border-gray rounded px-2.5 py-1.5 focus:outline-none"
                    />
                  </div>

                  <div>
                    <label className="font-bold block mb-1">Finalidade Principal</label>
                    <select
                      value={lineForm.finalidadePrincipal}
                      onChange={e => setLineForm({...lineForm, finalidadePrincipal: e.target.value})}
                      className="w-full border border-border-gray rounded px-2.5 py-1.5 bg-white focus:outline-none"
                    >
                      <option value="Custeio">Custeio</option>
                      <option value="Investimento">Investimento</option>
                    </select>
                  </div>

                  <div>
                    <label className="font-bold block mb-1">Tags de Finalidade (Separadas por vírgula)</label>
                    <input
                      type="text"
                      value={lineForm.finalidades}
                      onChange={e => setLineForm({...lineForm, finalidades: e.target.value})}
                      placeholder="agricola, pecuaria, custeio..."
                      className="w-full border border-border-gray rounded px-2.5 py-1.5 focus:outline-none"
                    />
                  </div>

                  <div>
                    <label className="font-bold block mb-1">Enquadramento de Renda (Texto descritivo)</label>
                    <input
                      type="text"
                      value={lineForm.enquadramento}
                      onChange={e => setLineForm({...lineForm, enquadramento: e.target.value})}
                      placeholder="Sem limite / R$ 500 mil"
                      className="w-full border border-border-gray rounded px-2.5 py-1.5 focus:outline-none"
                    />
                  </div>

                  <div>
                    <label className="font-bold block mb-1">Taxa de Juros Descrita</label>
                    <input
                      type="text"
                      value={lineForm.taxaDescricao}
                      onChange={e => setLineForm({...lineForm, taxaDescricao: e.target.value})}
                      placeholder="3% a 5% a.a."
                      className="w-full border border-border-gray rounded px-2.5 py-1.5 focus:outline-none"
                    />
                  </div>

                  <div>
                    <label className="font-bold block mb-1">Taxa Mínima (%)</label>
                    <input
                      type="number"
                      step="0.01"
                      value={lineForm.taxaMin}
                      onChange={e => setLineForm({...lineForm, taxaMin: e.target.value})}
                      className="w-full border border-border-gray rounded px-2.5 py-1.5 focus:outline-none"
                    />
                  </div>

                  <div>
                    <label className="font-bold block mb-1">Taxa Máxima (%)</label>
                    <input
                      type="number"
                      step="0.01"
                      value={lineForm.taxaMax}
                      onChange={e => setLineForm({...lineForm, taxaMax: e.target.value})}
                      className="w-full border border-border-gray rounded px-2.5 py-1.5 focus:outline-none"
                    />
                  </div>

                  <div>
                    <label className="font-bold block mb-1">Prazo Máximo (Meses)</label>
                    <input
                      type="number"
                      value={lineForm.prazo}
                      onChange={e => setLineForm({...lineForm, prazo: e.target.value})}
                      className="w-full border border-border-gray rounded px-2.5 py-1.5 focus:outline-none"
                    />
                  </div>

                  <div>
                    <label className="font-bold block mb-1">Carência Máxima (Meses)</label>
                    <input
                      type="number"
                      value={lineForm.carencia}
                      onChange={e => setLineForm({...lineForm, carencia: e.target.value})}
                      className="w-full border border-border-gray rounded px-2.5 py-1.5 focus:outline-none"
                    />
                  </div>

                  <div>
                    <label className="font-bold block mb-1">Limite Mínimo Financiável (R$)</label>
                    <input
                      type="number"
                      value={lineForm.limiteMin}
                      onChange={e => setLineForm({...lineForm, limiteMin: e.target.value})}
                      className="w-full border border-border-gray rounded px-2.5 py-1.5 focus:outline-none"
                    />
                  </div>

                  <div>
                    <label className="font-bold block mb-1">Limite Máximo Financiável (R$)</label>
                    <input
                      type="number"
                      value={lineForm.limiteMax}
                      onChange={e => setLineForm({...lineForm, limiteMax: e.target.value})}
                      className="w-full border border-border-gray rounded px-2.5 py-1.5 focus:outline-none"
                    />
                  </div>

                  <div className="md:col-span-2">
                    <label className="font-bold block mb-1">Culturas Especificadas e Limites de Cultura (Texto regra)</label>
                    <input
                      type="text"
                      value={lineForm.culturas}
                      onChange={e => setLineForm({...lineForm, culturas: e.target.value})}
                      placeholder="SOJA, MILHO (ate 25 mil), TRIGO"
                      className="w-full border border-border-gray rounded px-2.5 py-1.5 focus:outline-none"
                    />
                  </div>

                  <div className="md:col-span-2">
                    <label className="font-bold block mb-1">Itens Financiáveis (Máquinas, Insumos...)</label>
                    <textarea
                      rows="2"
                      value={lineForm.itensFinanciaveis}
                      onChange={e => setLineForm({...lineForm, itensFinanciaveis: e.target.value})}
                      className="w-full border border-border-gray rounded px-2.5 py-1.5 focus:outline-none"
                    />
                  </div>

                  <div className="md:col-span-2">
                    <label className="font-bold block mb-1">Documentos Necessários (Um por linha)</label>
                    <textarea
                      rows="3"
                      value={lineForm.documentos}
                      onChange={e => setLineForm({...lineForm, documentos: e.target.value})}
                      className="w-full border border-border-gray rounded px-2.5 py-1.5 focus:outline-none"
                    />
                  </div>

                  <div className="md:col-span-2">
                    <label className="font-bold block mb-1">Requisitos de Enquadramento do Cooperado</label>
                    <textarea
                      rows="2"
                      value={lineForm.requisitos}
                      onChange={e => setLineForm({...lineForm, requisitos: e.target.value})}
                      className="w-full border border-border-gray rounded px-2.5 py-1.5 focus:outline-none"
                    />
                  </div>
                </div>

                <div className="flex justify-end gap-2 pt-2 border-t border-border-gray/50">
                  <button
                    type="button"
                    onClick={() => {
                      setShowAddModal(false);
                      setShowEditModal(false);
                    }}
                    className="border border-border-gray text-text-gray font-bold px-4 py-2 rounded"
                  >
                    Cancelar
                  </button>
                  <button
                    type="submit"
                    className="bg-accent-orange text-white font-bold px-5 py-2 rounded hover:bg-opacity-95"
                  >
                    Salvar Alterações
                  </button>
                </div>
              </form>
            </div>
          )}

          {/* SPINNER OVERLAY DE CARREGAMENTO */}
          {loading && (
            <div className="fixed inset-0 z-50 flex flex-col items-center justify-center bg-black/60 text-white">
              <div className="w-12 h-12 border-4 border-t-accent-orange border-r-white/20 border-b-white/20 border-l-white/20 rounded-full animate-spin"></div>
              <p className="mt-4 text-sm font-bold tracking-wide">{loadingText}</p>
            </div>
          )}

        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
